name: Lint
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: false

permissions:
  contents: read # checkout

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: codeberg-small
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install System Dependencies
        shell: bash
        run: .forgejo/scripts/install-deps.sh

      - name: Install Rust (nightly + rustfmt)
        shell: bash
        run: .forgejo/scripts/install-rust.sh nightly rustfmt
      - name: Check Formatting
        shell: bash
        run: |
          set -euxo pipefail
          . "$HOME/.cargo/env"
          cargo +nightly fmt --all -- --check

  check:
    name: Check
    runs-on: codeberg-medium
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Rust Build Artifacts
        uses: https://data.forgejo.org/actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install System Dependencies
        shell: bash
        run: .forgejo/scripts/install-deps.sh jq pkg-config perl

      - name: Install Rust
        shell: bash
        run: .forgejo/scripts/install-rust.sh stable

      - name: Cargo Check
        shell: bash
        run: |
          set -euxo pipefail
          . "$HOME/.cargo/env"
          cargo check --locked --features vendored

  clippy:
    name: Clippy
    runs-on: codeberg-medium
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Rust Build Artifacts
        uses: https://data.forgejo.org/actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install System Dependencies
        shell: bash
        run: .forgejo/scripts/install-deps.sh pkg-config

      - name: Install Rust
        shell: bash
        run: .forgejo/scripts/install-rust.sh nightly clippy
      - name: Run Clippy
        shell: bash
        run: |
          set -euxo pipefail
          . "$HOME/.cargo/env"
          cargo +nightly clippy --locked --workspace --all-targets --features vendored -- -D warnings
